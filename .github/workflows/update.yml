name: Update EBIC Live Luck Dashboard

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 17-23 * * 0'
    - cron: '*/15 0-4 * * 1,2,5'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run luck & projection engine
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python update_dashboard.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live scores" && git push)
